services:
  api:
    build: .
    image: voice-coach-backend
    command: uvicorn server:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  agent:
    image: voice-coach-backend
    command: python agent.py start
    env_file: .env
    restart: unless-stopped